{% include 'user_navigation.html' %}

<style>
    .confirm-box {
        max-width: 700px;
        margin: 80px auto 30px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }
    .confirm-header {
        background: linear-gradient(135deg, #28a745, #1e7e34);
        color: white;
        padding: 28px 30px;
        text-align: center;
    }
    .confirm-body {
        background: #f9f9f9;
        padding: 36px 30px 28px;
        text-align: center;
    }
    .confirm-body h3 {
        color: #1f7a1f;
        font-weight: 700;
    }
    .job-title {
        color: #0d6efd;
        font-weight: 700;
    }
    .confirm-actions {
        margin-top: 22px;
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }
    .confirm-btn {
        min-width: 180px;
        border-radius: 12px;
        font-weight: 600;
        padding: 12px 24px;
    }
</style>

<div class="container">
    <div class="card confirm-box border-0">
        <div class="confirm-header">
            <h2 class="mb-0"><i class="fa fa-check-circle mr-2"></i>You are eligible for this job</h2>
        </div>
        <div class="confirm-body">
            <h3>Are you sure you want to apply for this job?</h3>
            <p class="lead mb-0">Job: <span class="job-title">{{ job.title }}</span></p>
            <div class="confirm-actions">
                <form method="post" action="{% url 'apply_now' job.id %}" style="display:inline;">
                    {% csrf_token %}
                    <input type="hidden" name="proceed" value="1">
                    <button type="submit" class="btn btn-success confirm-btn">Yes, Apply Now</button>
                </form>
                <a href="{% url 'user_home' %}" class="btn btn-secondary confirm-btn">No, Go Home</a>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
