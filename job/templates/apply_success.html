{% include 'user_navigation.html' %}

<style>
    .success-box {
        max-width: 760px;
        margin: 80px auto 30px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 14px 32px rgba(40, 167, 69, 0.18);
    }
    .success-header {
        background: linear-gradient(135deg, #28a745, #1f8f3d);
        color: white;
        padding: 28px 30px;
        text-align: center;
    }
    .success-header h2 {
        margin: 0;
        font-weight: 800;
        letter-spacing: 0.3px;
    }
    .success-body {
        background: linear-gradient(180deg, #f7fff8 0%, #edfdf1 100%);
        padding: 40px 30px 32px;
        text-align: center;
    }
    .success-icon {
        font-size: 68px;
        color: #28a745;
        margin-bottom: 18px;
        animation: popIn 0.5s ease-out;
    }
    @keyframes popIn {
        0% { transform: scale(0.7); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    .success-body h3 {
        color: #1e7e34;
        font-weight: 800;
        margin-bottom: 12px;
    }
    .success-body p {
        font-size: 1.08rem;
        color: #1f2d3d;
        margin-bottom: 0;
    }
    .success-actions {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
    }
    .success-btn {
        min-width: 190px;
        border-radius: 12px;
        font-weight: 700;
        padding: 12px 22px;
    }
</style>

<div class="container">
    <div class="card success-box border-0">
        <div class="success-header">
            <h2><i class="fa fa-check-circle mr-2"></i>Application Submitted Successfully</h2>
        </div>
        <div class="success-body">
            <div class="success-icon"><i class="fa fa-check-circle"></i></div>
            <h3>You have successfully applied for {{ job.title }}</h3>
            <p>Your application has been submitted successfully and is currently under review.</p>
            <div class="success-actions">
                <a href="{% url 'user_home' %}" class="btn btn-success success-btn">Back to Home</a>
                <a href="{% url 'my_applied_jobs' %}" class="btn btn-outline-success success-btn">My Applied Jobs</a>
            </div>
        </div>
    </div>
</div>
