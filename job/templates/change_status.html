{% load static %}

{% block body %}

{% include 'admin_navigation.html' %}

<marquee style="font-family: 'Monotype Corsiva'; font-size:25px; color:darkcyan; background-color:black; font-weight:bold; margin-top:1%">
        View Recruiter - Pending
</marquee>
<hr>

<form class="container mt-5" method="post">
    {% csrf_token %}
    <label><b>Recruiter Name:</b></label>
    <input type="text" class="form-control" name="uname" value="{{recuiter.user.first_name}}  {{recuiter.user.last_name}}">
    <label><b>Status:</b></label>
    <select class="form-control" name="status">
        <option value="Accept">Accept</option>
        <option value="Reject">Reject</option>
    </select>

    <input type="submit" class="btn btn-primary" style="margin-top:2%; color:darkcyan; background-color:black ; height:50px; font-size:25px">
</form>
{% include 'footer.html' %}

{% if error == "no" %}
<script>
    alert("Status Changed Successfully")
    window.location = ('{% url 'recuiter_all' %}')
</script>
{% endif %}

{% if error == "yes" %}
<script>
    alert("Please check the recruiter details and try again.")
</script>
{% endif %}
{% endblock %}
