{% load static %}

{% block body %}

{% include 'navigation.html' %}

<script>
    function togglePassword(fieldId, iconId) {
        var field = document.getElementById(fieldId);
        var icon = document.getElementById(iconId);
        if (!field || !icon) return;
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
</script>

<marquee style="font-family: 'Monotype Corsiva'; font-size:25px; color:darkcyan; background-color:black; font-weight:bold; margin-top:1%">
    Reset Password
</marquee>
<hr>

<div class="container mt-5">
    <form method="post" class="col-md-6 mx-auto border p-4 rounded" data-reset-on-back="true">
        {% csrf_token %}
        <label><b>New Password:</b></label>
        <div class="input-group">
            <input type="password" id="newPassword" class="form-control" name="password" placeholder="Enter new password" required>
            <div class="input-group-append">
                <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('newPassword', 'newPasswordEye')">
                    <i id="newPasswordEye" class="fa fa-eye"></i>
                </button>
            </div>
        </div>

        <label class="mt-3"><b>Confirm Password:</b></label>
        <div class="input-group">
            <input type="password" id="confirmPassword" class="form-control" name="confirm_password" placeholder="Confirm new password" required>
            <div class="input-group-append">
                <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword', 'confirmPasswordEye')">
                    <i id="confirmPasswordEye" class="fa fa-eye"></i>
                </button>
            </div>
        </div>

        {% if error == 'match' %}
        <div class="alert alert-danger mt-3">Password and confirm password do not match.</div>
        {% elif error == 'invalid' %}
        <div class="alert alert-danger mt-3">Please enter both passwords.</div>
        {% endif %}

        <button type="submit" class="btn btn-primary mt-3" style="color:darkcyan; background-color:black; height:50px; font-size:22px">Reset Password</button>
    </form>
</div>

{% include 'footer.html' %}
{% endblock %}
